#cloud-config
package_update: true
packages:
  - curl
  - wget
  - unzip
  - sysstat
  - default-jre
  - rclone
  - python3
  - python-is-python3
  - python3-venv
  - python3-pip
  - gdal-bin

write_files:
  # This file avoids apt-get clashes by letting it wait up to 10 minutes until the lock is free.
  - path: /etc/apt/apt.conf.d/99-dpkg-lock-timeout
    content: |
      DPkg::Lock::Timeout "600";
    owner: root:root
    permissions: '0644'
  - path: /opt/pmtiles/env.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      # Environment variables for the android jobs
      export BASE=/opt/pmtiles
      export DATADIR=/mnt
      {{ENV_BLOCK}}
  - path: /opt/pmtiles/setup.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      set -xeuo pipefail
      . /opt/pmtiles/env.sh

      mkdir -p ${BASE}/logs

      # Install Azure CLI
      curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # Mount disk, needed only for v6 and later NVME disks
      if [ -b /dev/nvme1n1 ]
      then
        # Build a list of all the nvme devices; there are 2 or 3 depending on VM size
        DEVS=/dev/nvme[1-3]n1
        DEV_COUNT=$(echo ${DEVS} | wc -w)
        mkdir -p /mnt
        if [ "${DEV_COUNT}" -eq 1 ]; then
          echo "Only one NVMe device found, skipping RAID setup."
          mkfs.ext4 /dev/nvme1n1
          mount /dev/nvme1n1 /mnt
        else
          mdadm --create /dev/md0 --level=0 --raid-devices=${DEV_COUNT} ${DEVS}
          mkfs.ext4 /dev/md0
          mkdir -p /mnt
          mount /dev/md0 /mnt
        fi
      fi

      # Download files from storage account.
      az login --identity
      az storage blob download-batch \
        --auth-mode login \
        --account-name ${STORAGE_ACCOUNT_NAME} \
        --destination ${BASE} \
        --source ${DOWNLOAD_CONTAINER_NAME} \
        --pattern files.tgz
      tar -xzf ${BASE}/files.tgz -C ${BASE}

      # Load install files; last thing to run as root.
      # Needs to be run before all the file permissions stuff below, as some things are installed
      # into the base directory.
      bash -x ${BASE}/install.sh

      # Set up file permissions
      chown -R azureuser:azureuser ${BASE}
      chmod '0777' /mnt
      chmod '0755' /opt/pmtiles/android.sh
      chmod '0755' /opt/pmtiles/terminate.sh

runcmd:
  - [ bash, /opt/pmtiles/setup.sh ]
  - [ su, '-', azureuser, -c, /opt/pmtiles/android.sh ]
  - [ su, '-', azureuser, -c, /opt/pmtiles/terminate.sh ]