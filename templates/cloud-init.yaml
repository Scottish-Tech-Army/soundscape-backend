#cloud-config
package_update: true
packages:
  - curl
  - wget
  - unzip
  - postgresql-client-common
  - postgresql-client-16
  - jq
  - sysstat
  - python3
  - python3-pip
  - python3-setuptools
  - python3-venv

write_files:
  - path: /opt/ingest/env.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      # Environment variables for the ingest job
      export IMPOSM_BINARY_RELEASE=0.14.2
      export POSTGIS_USER=pgadmin
      export POSTGIS_DBNAME=osm
      export POSTGIS_PORT=5432
      export PYTHONUNBUFFERED=true
      export INGEST=/opt/ingest
      export TILES=/mnt
      {{ENV_BLOCK}}

  - path: /opt/ingest/setup.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      . /opt/ingest/env.sh

      # Install Azure CLI
      curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # Login
      az login --identity

      # Install AMA for Log Analytics
      az vm extension set \
        --publisher Microsoft.Azure.Monitor \
        --name AzureMonitorLinuxAgent \
        --ids $(curl -s -H Metadata:true \
              --noproxy "*" \
              "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | jq -r '.compute.resourceId') \
        --settings "{\"workspaceId\": \"${LAW_ID}\"}" \
        --protected-settings "{\"workspaceKey\": \"${LAW_KEY}\"}"

      mkdir -p ${INGEST}/files
      mkdir -p ${INGEST}/imposm3
      wget -q -O - https://github.com/omniscale/imposm3/releases/download/v$IMPOSM_BINARY_RELEASE/imposm-$IMPOSM_BINARY_RELEASE-linux-x86-64.tar.gz | tar -xz --strip-components=1 -C ${INGEST}/imposm3

      # ENV PYTHONUNBUFFERED=true INGEST=${HOME}/ingest
      # COPY requirements.txt ingest_simple.py config.json mapping.yml ${INGEST}/
      # COPY extracts/ /${INGEST}/extracts/

      # Create venv and install deps
      # RUN python3 -m venv ${INGEST}/venv && ${INGEST}/venv/bin/pip install --no-cache-dir -r $INGEST/requirements.txt

  - path: /opt/ingest/runjob.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      . /opt/ingest/env.sh

      # Ensure venv Python is default for CMD and any shell-in debugging
      PATH="/opt/ingest/venv/bin:$PATH"

      python3 ${INGEST}/ingest_simple.py --imposm ${INGEST}/imposm3/imposm --mapping ${INGEST}/mapping.yml --extracts ${INGEST}/extracts/extracts-${GEN_REGIONS}.json \
        --basedir ${TILES} --verbose --config ${INGEST}/config.json

      # === YOUR JOB HERE ===
      #echo "Starting job..."
      # Example workload
      #curl -s https://example.com/workload.zip -o /tmp/workload.zip
      #unzip /tmp/workload.zip -d /opt/workload
      #/opt/workload/run.sh

      # Upload artifacts to blob
      #if [ -d /opt/workload/output ]; then
      #  wget -O /usr/local/bin/azcopy https://aka.ms/downloadazcopy-v10-linux && chmod +x /usr/local/bin/azcopy
      #  azcopy copy "/opt/workload/output/*" "$OUTPUT_SAS_URL" --recursive
      #fi

      # Shutdown after completion
      #sudo shutdown -h now

runcmd:
  - [ bash, /opt/ingest/setup.sh ]
  - [ chown, -R, azureuser:azureuser, /opt/ingest ]
  - [ chmod, '0777', /mnt ]
