#cloud-config
package_update: true
packages:
  - curl
  - wget
  - unzip
  - sysstat

write_files:
  - path: /opt/photon/env.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      # Environment variables for the android jobs
      export BASE=/opt/photon
      export DATADIR=/mnt
      {{ENV_BLOCK}}
  - path: /opt/photon/setup.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      set -euo pipefail
      . /opt/pmtiles/env.sh

      mkdir -p ${BASE}/logs

      # Install Azure CLI
      curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # Mount disk, needed only for v6 and later NVME disks
      # FIXME xxx - sort out disks
      if [ -b /dev/nvme1n1 ]
      then
        # Build a list of all the nvme devices; there are 2 or 3 depending on VM size
        DEVS=/dev/nvme[1-3]n1
        DEV_COUNT=$(echo ${DEVS} | wc -w)
        mkdir -p /mnt
        if [ "${DEV_COUNT}" -eq 1 ]; then
          echo "Only one NVMe device found, skipping RAID setup."
          mkfs.ext4 /dev/nvme1n1
          mount /dev/nvme1n1 /mnt
        else
          mdadm --create /dev/md0 --level=0 --raid-devices=${DEV_COUNT} ${DEVS}
          mkfs.ext4 /dev/md0
          mkdir -p /mnt
          mount /dev/md0 /mnt
        fi
      fi

      # Download files from storage account.
      az login --identity
      az storage blob download-batch \
        --auth-mode login \
        --account-name ${STORAGE_ACCOUNT_NAME} \
        --destination ${BASE} \
        --source ${DOWNLOAD_CONTAINER_NAME} \
        --pattern files.tgz
      tar -xzf ${BASE}/files.tgz -C ${BASE}

      # Load install files.
      bash ${BASE}/install.sh

runcmd:
  - [ bash, /opt/photon/setup.sh ]
  - [ chown, -R, azureuser:azureuser, /opt/photon ]
  - [ chmod, '0777', /mnt ]
  - [ chmod, '0755', /opt/photon/photon.sh ]
  - [ su, '-', azureuser, -c, /opt/photon/photon.sh ]
  # FIXME: these files do not exist yet