#cloud-config
package_update: true
packages:
  - curl
  - wget
  - unzip
  - postgresql-client-common
  - postgresql-client-16
  - jq
  - sysstat
  - python3
  - python3-pip
  - python3-setuptools
  - python3-venv
  - python-is-python3

write_files:
  - path: /opt/ingest/env.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      # Environment variables for the ingest job
      export IMPOSM_BINARY_RELEASE=0.14.2
      export POSTGIS_USER=pgadmin
      export POSTGIS_DBNAME=osm
      export POSTGIS_PORT=5432
      export PYTHONUNBUFFERED=true
      export BASE=/opt/ingest
      export TILES=/mnt
      {{ENV_BLOCK}}
  - path: /opt/ingest/setup.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      set -euo pipefail
      . /opt/ingest/env.sh

      mkdir -p ${BASE}/logs

      # Install Azure CLI
      curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # Install imposm
      mkdir -p ${BASE}/imposm3
      wget -q -O - https://github.com/omniscale/imposm3/releases/download/v$IMPOSM_BINARY_RELEASE/imposm-$IMPOSM_BINARY_RELEASE-linux-x86-64.tar.gz | tar -xz --strip-components=1 -C ${BASE}/imposm3

      # Mount disk, needed only for v6 and later NVME disks
      if [ -b /dev/nvme1n1 ]
      then
        # Build a list of all the nvme devices; there are 2 or 3 depending on VM size
        DEVS=/dev/nvme[1-3]n1
        DEV_COUNT=$(echo ${DEVS} | wc -w)
        mkdir -p /mnt
        if [ "${DEV_COUNT}" -eq 1 ]; then
          echo "Only one NVMe device found, skipping RAID setup."
          mkfs.ext4 /dev/nvme1n1
          mount /dev/nvme1n1 /mnt
        else
          mdadm --create /dev/md0 --level=0 --raid-devices=${DEV_COUNT} ${DEVS}
          mkfs.ext4 /dev/md0
          mkdir -p /mnt
          mount /dev/md0 /mnt
        fi
      fi

      # Download files from storage account.
      az login --identity
      az storage blob download-batch \
        --auth-mode login \
        --account-name ${STORAGE_ACCOUNT_NAME} \
        --destination /opt/ingest \
        --source ${DOWNLOAD_CONTAINER_NAME} \
        --pattern files.tgz
      tar -xzf /opt/ingest/files.tgz -C ${BASE}

      # Create venv and install deps
      python3 -m venv ${BASE}/venv && ${BASE}/venv/bin/pip install --no-cache-dir -r ${BASE}/requirements-ingest.txt

      # Set up file permissions
      chown -R azureuser:azureuser ${BASE}
      chmod '0777' /mnt
      chmod '0755' /opt/ingest/ingest.sh
      chmod '0755' /opt/ingest/terminate.sh

runcmd:
  - [ bash, /opt/ingest/setup.sh ]
  - [ su, '-', azureuser, -c, /opt/ingest/ingest.sh ]
  - [ su, '-', azureuser, -c, /opt/ingest/terminate.sh ]